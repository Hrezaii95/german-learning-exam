<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubs Dashboard — German Learning OS (Design)</title>
  <link rel="stylesheet" href="../design/infographics/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--glos-font-body);
      background: var(--glos-content-bg);
      color: var(--glos-text-primary);
      line-height: 1.5;
      font-size: 17px;
      padding-bottom: 2rem;
    }

    header {
      background: var(--glos-sidebar-bg);
      color: var(--glos-text-inverse);
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--glos-shadow-md);
    }

    header h1 {
      font-family: var(--glos-font-display);
      font-size: 1.35rem;
      font-weight: 800;
    }

    header p { font-size: 0.9rem; color: rgba(255,255,255,0.72); margin-top: 0.25rem; }
    header a { color: #c7d2fe; font-weight: 600; }
    .voice-badge { font-size: 0.8rem; color: #c7d2fe; margin-top: 0.35rem; font-weight: 600; }

    /* Dashboard stats strip — streak icon per INFOGRAPHIC-SYSTEM §9 */
    .dashboard-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--glos-space-3);
      padding: var(--glos-space-4) 1rem;
      background: var(--glos-surface);
      border-bottom: 1px solid var(--glos-border);
    }

    .stat-card {
      text-align: center;
      padding: var(--glos-space-3);
      border-radius: var(--glos-radius-md);
      background: var(--glos-content-bg);
      border: 1px solid var(--glos-border);
    }

    .stat-card .stat-value {
      font-family: var(--glos-font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--glos-accent);
      line-height: 1.1;
    }

    .stat-card .stat-label {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--glos-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-card--streak .stat-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--glos-streak);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-card--streak .streak-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .stat-card--streak .stat-suffix {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--glos-text-secondary);
      -webkit-text-fill-color: var(--glos-text-secondary);
    }

    .design-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0.75rem 1rem;
      background: var(--glos-surface);
      border-bottom: 1px solid var(--glos-border);
    }

    .design-links a {
      padding: 6px 12px;
      border-radius: var(--glos-radius-pill);
      border: 1px solid var(--glos-border);
      background: var(--glos-content-bg);
      color: var(--glos-accent);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .design-links a:hover { border-color: var(--glos-accent); }

    nav.tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--glos-surface);
      border-bottom: 1px solid var(--glos-border);
      position: sticky;
      top: 0;
      z-index: 99;
    }

    nav.tabs button {
      flex: 1 1 30%;
      min-height: 48px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--glos-border);
      border-radius: var(--glos-radius-md);
      background: var(--glos-content-bg);
      cursor: pointer;
      color: var(--glos-text-primary);
    }

    nav.tabs button.active {
      background: var(--glos-accent);
      color: var(--glos-text-inverse);
      border-color: var(--glos-accent);
    }

    main { padding: 1rem; max-width: 960px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .sub-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 1rem 0; }
    .sub-tabs button {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--glos-border);
      border-radius: var(--glos-radius-sm);
      background: var(--glos-surface);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .sub-tabs button.active {
      background: var(--glos-accent-soft);
      border-color: var(--glos-accent);
      color: var(--glos-accent);
      font-weight: 700;
    }

    h2 {
      font-family: var(--glos-font-display);
      font-size: 1.15rem;
      margin: 1rem 0 0.5rem;
      border-bottom: 2px solid var(--glos-border);
      padding-bottom: 0.3rem;
    }

    h3 { font-size: 1rem; margin: 1rem 0 0.5rem; color: var(--glos-text-secondary); }

    .row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem;
      border: 1px solid var(--glos-border);
      border-radius: var(--glos-radius-md);
      margin-bottom: 0.4rem;
      background: var(--glos-surface);
      box-shadow: var(--glos-shadow-sm);
    }

    .row .text { flex: 1; }
    .row .de { font-weight: 700; }
    .row .en { color: var(--glos-text-secondary); font-size: 0.9rem; }

    .der { color: var(--glos-der); font-weight: 700; }
    .die { color: var(--glos-die); font-weight: 700; }
    .plural { color: var(--glos-plural); font-weight: 700; }

    .play, .play-slow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .play { border: none; background: var(--glos-accent); color: #fff; font-size: 1.1rem; }
    .play-slow { border: 2px solid var(--glos-accent); background: var(--glos-surface); color: var(--glos-accent); }

    .empty { color: var(--glos-text-muted); padding: 2rem; text-align: center; }

    table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1rem; font-size: 0.95rem; background: var(--glos-surface); }
    th, td { border: 1px solid var(--glos-border); padding: 0.5rem; text-align: left; }
    th { background: var(--glos-sidebar-bg); color: var(--glos-text-inverse); }

    .qa-block { border-left: 3px solid var(--glos-accent); padding-left: 0.75rem; margin: 0.75rem 0; }

    .tag {
      display: inline-block;
      background: var(--glos-accent-soft);
      color: var(--glos-accent);
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.25rem;
    }

    .alpha-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 0.35rem;
      margin: 0.5rem 0 1rem;
    }

    .alpha-card {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border: 1px solid var(--glos-border);
      border-radius: var(--glos-radius-sm);
      cursor: pointer;
      background: var(--glos-surface);
    }

    .beruf-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
    @media (min-width: 600px) { .beruf-grid { grid-template-columns: 1fr 1fr; } }

    .beruf-card {
      border: 1px solid var(--glos-border);
      border-radius: var(--glos-radius-md);
      padding: 0.75rem;
      background: var(--glos-surface);
      box-shadow: var(--glos-shadow-sm);
    }

    .beruf-card .en { font-weight: 700; margin-bottom: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <h1>German Learning OS — Hubs</h1>
    <p>Design lane · extracted Momente content. <a href="exam.html">Exam cram</a> · <a href="../design/infographics/">Infographics</a></p>
    <div id="voice-badge" class="voice-badge">Loading voice…</div>
  </header>

  <div class="dashboard-strip" id="dashboard-strip" role="group" aria-label="Progress stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-lessons">—</div>
      <div class="stat-label">Lessons</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-vocab">—</div>
      <div class="stat-label">Vocabulary</div>
    </div>
    <div class="stat-card stat-card--streak">
      <div class="stat-value">
        <img src="assets/icons/streak.png" alt="" class="streak-icon" width="26" height="26">
        <span id="stat-streak">7</span>
        <span class="stat-suffix">days</span>
      </div>
      <div class="stat-label">Study Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-xp">2,450</div>
      <div class="stat-label">XP Earned</div>
    </div>
  </div>

  <div class="design-links">
    <a href="../design/infographics/">All previews</a>
    <a href="../design/infographics/vocab-card-ingenieur.html">Vocab card</a>
    <a href="../design/infographics/verb-sein.html">Verb sein</a>
    <a href="../design/infographics/grammar-cases.html">Grammar</a>
    <a href="../design/infographics/berufe-grid-sample.html">Berufe grid</a>
  </div>

  <nav class="tabs">
    <button class="active" data-tab="vocab">Vocabulary</button>
    <button data-tab="phrases">Phrases &amp; Q&amp;A</button>
    <button data-tab="grammar">Grammar</button>
  </nav>

  <main>
    <section id="vocab" class="panel active"><p class="empty">Loading…</p></section>
    <section id="phrases" class="panel"><p class="empty">Loading…</p></section>
    <section id="grammar" class="panel"><p class="empty">Loading…</p></section>
  </main>

  <script>
(function () {
  'use strict';

  let hubs = { vocab: null, phrases: null, grammar: null };
  let vocabTopic = null;
  let phraseTopic = null;
  let grammarTopic = null;
  let deVoice = null;

  function pickDeVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = speechSynthesis.getVoices();
    deVoice = voices.find(function (v) { return v.lang === 'de-DE'; })
      || voices.find(function (v) { return v.lang && v.lang.toLowerCase().startsWith('de'); })
      || null;
    const el = document.getElementById('voice-badge');
    if (el) el.textContent = deVoice ? ('Voice: ' + deVoice.name) : 'Voice: de-DE (default)';
    return deVoice;
  }

  if ('speechSynthesis' in window) {
    pickDeVoice();
    speechSynthesis.onvoiceschanged = function () { deVoice = null; pickDeVoice(); };
  }

  function speak(text, rate) {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g, '').split(' / ')[0].trim());
    u.lang = 'de-DE';
    u.rate = rate || 0.9;
    const v = deVoice || pickDeVoice();
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  function playBtns(text) {
    const wrap = document.createElement('span');
    wrap.style.display = 'inline-flex';
    wrap.style.gap = '4px';
    const n = document.createElement('button');
    n.className = 'play';
    n.type = 'button';
    n.textContent = '▶';
    n.onclick = function (e) { e.stopPropagation(); speak(text, 0.9); };
    const s = document.createElement('button');
    s.className = 'play-slow';
    s.type = 'button';
    s.textContent = '🐢';
    s.onclick = function (e) { e.stopPropagation(); speak(text, 0.75); };
    wrap.appendChild(n);
    wrap.appendChild(s);
    return wrap;
  }

  function colorize(text) {
    if (!text) return '';
    if (/^der /.test(text)) return '<span class="der">' + text + '</span>';
    if (/^die /.test(text)) {
      const w = text.slice(4);
      if (/innen$|männer$|frauen$|leute$/.test(w)) return '<span class="plural">' + text + '</span>';
      return '<span class="die">' + text + '</span>';
    }
    return text;
  }

  function row(de, en) {
    const div = document.createElement('div');
    div.className = 'row';
    const text = document.createElement('div');
    text.className = 'text';
    const d = document.createElement('div');
    d.className = 'de';
    d.innerHTML = colorize(de);
    const e = document.createElement('div');
    e.className = 'en';
    e.textContent = en || '';
    text.appendChild(d);
    text.appendChild(e);
    div.appendChild(text);
    div.appendChild(playBtns(de));
    div.addEventListener('click', function () { speak(de); });
    return div;
  }

  function subTabs(items, activeId, labelFn, onPick) {
    const nav = document.createElement('div');
    nav.className = 'sub-tabs';
    items.forEach(function (t) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = labelFn(t);
      if (t.id === activeId) btn.classList.add('active');
      btn.addEventListener('click', function () { onPick(t.id); });
      nav.appendChild(btn);
    });
    return nav;
  }

  function countVocabItems() {
    const topics = hubs.vocab?.topics || [];
    return topics.reduce(function (sum, t) {
      if (t.professions) return sum + t.professions.length;
      return sum + (t.entries?.length || 0);
    }, 0);
  }

  function updateDashboardStrip() {
    const vocabEl = document.getElementById('stat-vocab');
    const lessonsEl = document.getElementById('stat-lessons');
    if (vocabEl) vocabEl.textContent = countVocabItems() || '—';
    if (lessonsEl) lessonsEl.textContent = String((hubs.vocab ? 1 : 0) + (hubs.phrases ? 1 : 0) + (hubs.grammar ? 1 : 0));
  }

  function renderVocab() {
    const el = document.getElementById('vocab');
    const hub = hubs.vocab;
    if (!hub?.topics?.length) {
      el.innerHTML = '<p class="empty">vocab-hub.json not loaded. Run <code>npm start</code>.</p>';
      return;
    }
    if (!vocabTopic) vocabTopic = hub.topics[0].id;
    const topic = hub.topics.find(function (t) { return t.id === vocabTopic; }) || hub.topics[0];
    el.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = 'Vocabulary · ' + (topic.title?.en || topic.id);
    el.appendChild(h);
    el.appendChild(subTabs(hub.topics, vocabTopic, function (t) { return t.title?.en || t.id; }, function (id) {
      vocabTopic = id;
      renderVocab();
    }));

    if (topic.id === 'alphabet') {
      const grid = document.createElement('div');
      grid.className = 'alpha-grid';
      'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜß'.split('').forEach(function (l) {
        const c = document.createElement('div');
        c.className = 'alpha-card';
        c.textContent = l;
        c.onclick = function () { speak(l); };
        grid.appendChild(c);
      });
      el.appendChild(grid);
      return;
    }

    if (topic.id === 'berufe' && topic.professions) {
      const grid = document.createElement('div');
      grid.className = 'beruf-grid';
      topic.professions.forEach(function (p) {
        const card = document.createElement('div');
        card.className = 'beruf-card';
        card.innerHTML = '<div class="en">' + p.english + '</div><div>' + colorize(p.mascSg) + '<br>' + colorize(p.femSg) + '</div>';
        card.appendChild(playBtns(p.mascSg));
        card.onclick = function () { speak(p.mascSg); };
        grid.appendChild(card);
      });
      el.appendChild(grid);
      return;
    }

    (topic.entries || []).forEach(function (e) {
      el.appendChild(row(e.german || e.de, e.english || e.en));
    });
  }

  function renderPhrases() {
    const el = document.getElementById('phrases');
    const hub = hubs.phrases;
    if (!hub?.topics?.length) {
      el.innerHTML = '<p class="empty">phrases-qa-hub.json not loaded.</p>';
      return;
    }
    if (!phraseTopic) phraseTopic = hub.topics[0].id;
    const topic = hub.topics.find(function (t) { return t.id === phraseTopic; }) || hub.topics[0];
    el.innerHTML = '';
    el.appendChild(subTabs(hub.topics, phraseTopic, function (t) { return t.title?.en || t.id; }, function (id) {
      phraseTopic = id;
      renderPhrases();
    }));

    (topic.phrases || []).forEach(function (p) {
      const r = row(p.de, p.en);
      if (p.formality || p.category) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = p.formality || p.category;
        r.querySelector('.de').appendChild(tag);
      }
      el.appendChild(r);
    });

    (topic.qa_pairs || []).forEach(function (qa) {
      const block = document.createElement('div');
      block.className = 'qa-block';
      let q = '';
      if (qa.question?.informal || qa.question?.formal) {
        q = [qa.question.informal, qa.question.formal].filter(Boolean).join(' · ');
      } else if (qa.question?.de) q = qa.question.de;
      const qh = document.createElement('h3');
      qh.textContent = q;
      block.appendChild(qh);
      block.appendChild(playBtns(q.split(' · ')[0]));
      (qa.answers || []).forEach(function (a) {
        (a.examples || []).forEach(function (ex) {
          block.appendChild(row(ex, a.pattern || ''));
        });
      });
      el.appendChild(block);
    });
  }

  function renderGrammar() {
    const el = document.getElementById('grammar');
    const hub = hubs.grammar;
    if (!hub?.topics?.length) {
      el.innerHTML = '<p class="empty">grammar-hub.json not loaded.</p>';
      return;
    }
    if (!grammarTopic) grammarTopic = hub.topics[0].id;
    const topic = hub.topics.find(function (t) { return t.id === grammarTopic; }) || hub.topics[0];
    el.innerHTML = '';
    el.appendChild(subTabs(hub.topics, grammarTopic, function (t) { return t.title?.en || t.id; }, function (id) {
      grammarTopic = id;
      renderGrammar();
    }));

    if (topic.rule) {
      const card = document.createElement('div');
      card.className = 'row';
      card.innerHTML = '<div class="text"><div class="de">Rule</div><div class="en">' + topic.rule + '</div></div>';
      el.appendChild(card);
    }
    (topic.items || []).forEach(function (item) {
      el.appendChild(row(item.de, item.en));
    });
    if (topic.table && typeof topic.table === 'object') {
      Object.keys(topic.table).forEach(function (verb) {
        const forms = topic.table[verb];
        const h = document.createElement('h3');
        h.textContent = verb;
        el.appendChild(h);
        if (typeof forms === 'string') {
          el.appendChild(row(forms, ''));
        } else {
          Object.keys(forms).forEach(function (pronoun) {
            el.appendChild(row(pronoun + ' ' + forms[pronoun], ''));
          });
        }
      });
    }

    if (hub.verbs?.length && grammarTopic === hub.topics[0].id) {
      const vh = document.createElement('h2');
      vh.textContent = 'Verb tables';
      el.appendChild(vh);
      hub.verbs.forEach(function (v) {
        const h = document.createElement('h3');
        h.textContent = v.infinitive + ' (' + (v.english || '') + ')';
        el.appendChild(h);
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Pronoun</th><th>Form</th><th></th></tr></thead>';
        const tbody = document.createElement('tbody');
        (v.conjugations || []).forEach(function (c) {
          const tr = document.createElement('tr');
          const tdPlay = document.createElement('td');
          tdPlay.appendChild(playBtns(c.pronoun + ' ' + c.form));
          tr.innerHTML = '<td>' + c.pronoun + '</td><td>' + c.form + '</td>';
          tr.appendChild(tdPlay);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        el.appendChild(table);
      });
    }
  }

  document.querySelectorAll('nav.tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  Promise.all([
    fetch('../content/extracted/vocab-hub.json').then(function (r) { return r.ok ? r.json() : null; }),
    fetch('../content/extracted/phrases-qa-hub.json').then(function (r) { return r.ok ? r.json() : null; }),
    fetch('../content/extracted/grammar-hub.json').then(function (r) { return r.ok ? r.json() : null; })
  ]).then(function (results) {
    hubs.vocab = results[0];
    hubs.phrases = results[1];
    hubs.grammar = results[2];
    updateDashboardStrip();
    renderVocab();
    renderPhrases();
    renderGrammar();
  }).catch(function () {
    document.getElementById('vocab').innerHTML = '<p class="empty">Failed to load hubs. Use <code>npm start</code> then open this page.</p>';
  });
})();
  </script>
</body>
</html>
