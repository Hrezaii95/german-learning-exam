      { p: 'er/sie/es', f: 'ist', en: 'he/she/it is', hi: true },
      { p: 'wir', f: 'sind', en: 'we are' }, { p: 'ihr', f: 'seid', en: 'you (pl.) are' },
      { p: 'Sie', f: 'sind', en: 'you (formal) are' }
    ]},
    { inf: 'heißen', en: 'to be called', rows: [
      { p: 'ich', f: 'heiße', en: 'I am called' }, { p: 'du', f: 'heißt', en: 'you are called' },
      { p: 'er/sie/es', f: 'heißt', en: 'he/she/it is called', hi: true },
      { p: 'wir', f: 'heißen', en: 'we are called' }, { p: 'ihr', f: 'heißt', en: 'you (pl.) are called' },
      { p: 'Sie', f: 'heißen', en: 'you (formal) are called' }
    ]},
    { inf: 'kommen', en: 'to come', rows: [
      { p: 'ich', f: 'komme', en: 'I come' }, { p: 'du', f: 'kommst', en: 'you come' },
      { p: 'er/sie/es', f: 'kommt', en: 'he/she/it comes', hi: true },
      { p: 'wir', f: 'kommen', en: 'we come' }, { p: 'ihr', f: 'kommt', en: 'you (pl.) come' },
      { p: 'Sie', f: 'kommen', en: 'you (formal) come' }
    ]},
    { inf: 'lernen', en: 'to learn', rows: [
      { p: 'ich', f: 'lerne', en: 'I learn' }, { p: 'du', f: 'lernst', en: 'you learn' },
      { p: 'er/sie/es', f: 'lernt', en: 'he/she/it learns', hi: true },
      { p: 'wir', f: 'lernen', en: 'we learn' }, { p: 'ihr', f: 'lernt', en: 'you (pl.) learn' },
      { p: 'Sie', f: 'lernen', en: 'you (formal) learn' }
    ]}
  ];

  ];

  const NUMBERS = [
    [0, 'null'], [1, 'eins'], [2, 'zwei'], [3, 'drei'], [4, 'vier'], [5, 'fünf'],
    [6, 'sechs'], [7, 'sieben'], [8, 'acht'], [9, 'neun'], [10, 'zehn'],
    [11, 'elf'], [12, 'zwölf'], [13, 'dreizehn'], [14, 'vierzehn'], [15, 'fünfzehn'],
    [16, 'sechzehn'], [17, 'siebzehn'], [18, 'achtzehn'], [19, 'neunzehn'], [20, 'zwanzig']
  ];

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜß'.split('');

  const WEAK_KEY = 'exam-cram-weak';
  const AUDIO_BASE = '../audio';
  let weakSet = loadWeak();
  let deVoice = null;
  let currentAudio = null;

  function loadWeak() {
    try { return new Set(JSON.parse(localStorage.getItem(WEAK_KEY)) || []); }
    catch (e) { return new Set(); }
  }

  function saveWeak() {
    localStorage.setItem(WEAK_KEY, JSON.stringify(Array.from(weakSet)));
  }

  function toggleWeak(id) {
    if (weakSet.has(id)) weakSet.delete(id);
    else weakSet.add(id);
    saveWeak();
    refreshWeakStyles();
  }

  function refreshWeakStyles() {
    document.querySelectorAll('[data-weak-id]').forEach(function (el) {
      const id = el.dataset.weakId;
      const marked = weakSet.has(id);
      el.classList.toggle('weak', marked);
      const btn = el.querySelector('.btn-weak');
      if (btn) {
        btn.classList.toggle('marked', marked);
        btn.textContent = marked ? '★' : '☆';
        btn.setAttribute('aria-label', marked ? 'Unmark weak' : 'Mark weak');
      }
    });
  }

  function weakBtn(id) {
    const marked = weakSet.has(id);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-weak' + (marked ? ' marked' : '');
    b.textContent = marked ? '★' : '☆';
    b.setAttribute('aria-label', marked ? 'Unmark weak' : 'Mark weak');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleWeak(id);
    });
    return b;
  }

  function pickDeVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = speechSynthesis.getVoices();
    deVoice = voices.find(function (v) { return v.lang === 'de-DE'; })
      || voices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf('de-de') === 0; })
      || voices.find(function (v) { return v.lang && v.lang.toLowerCase().startsWith('de'); })
      || null;
    updateVoiceBadge();
    return deVoice;
  }

  function updateVoiceBadge() {
    const el = document.getElementById('voice-badge');
    if (!el) return;
    if (!('speechSynthesis' in window)) {
      el.textContent = '🔊 TTS not supported in this browser';
      return;
    }
    if (deVoice) el.textContent = '🔊 Voice: ' + deVoice.name + ' (' + deVoice.lang + ')';
    else el.textContent = '🔊 Voice: de-DE (system default)';
  }

  if ('speechSynthesis' in window) {
    pickDeVoice();
    speechSynthesis.onvoiceschanged = function () { deVoice = null; pickDeVoice(); };
  }

  function speak(text, rate) {
    if (!text || !('speechSynthesis' in window)) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    try { text = decodeURIComponent(String(text)); } catch (e) { text = String(text); }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = rate || 0.9;
    const voice = deVoice || pickDeVoice();
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  function playMp3(relPath, fallbackText) {
    if (!relPath) return;
    speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const url = AUDIO_BASE + '/' + relPath.replace(/^\//, '');
    const audio = new Audio(encodeURI(url).replace(/#/g, '%23'));
    currentAudio = audio;
    audio.onerror = function () {
      currentAudio = null;
      if (fallbackText) speak(fallbackText);
    };
    audio.play().catch(function () {
      if (fallbackText) speak(fallbackText);
    });
  }

  function playControls(text) {
    const wrap = document.createElement('div');
    wrap.className = 'play-group';
    const normal = document.createElement('button');
    normal.className = 'play';
    normal.type = 'button';
    normal.setAttribute('aria-label', 'Speak German');
    normal.textContent = '▶';
    normal.addEventListener('click', function (e) {
      e.stopPropagation();
      speak(text, 0.9);
    });
    const slow = document.createElement('button');
    slow.className = 'play-slow';
    slow.type = 'button';
    slow.setAttribute('aria-label', 'Slow play 0.75');
    slow.textContent = '🐢';
    slow.addEventListener('click', function (e) {
      e.stopPropagation();
      speak(text, 0.75);
    });
    wrap.appendChild(normal);
    wrap.appendChild(slow);
    return wrap;
  }

  function playBtn(text) {
    return playControls(text);
  }

  function colorArticle(str, cls) {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = str;
    return span;
  }

  function renderPhrases() {
    const el = document.getElementById('phrases');
    let lastCat = '';
    LESSON1.forEach(function (item) {
      if (item.cat !== lastCat) {
        lastCat = item.cat;
        const h = document.createElement('h2');
        h.textContent = item.cat;
        el.appendChild(h);
      }
      const row = document.createElement('div');
      row.className = 'row';
      const mid = document.createElement('div');
      mid.style.flex = '1';
      const de = document.createElement('div');
      de.className = 'de';
      de.style.fontWeight = '700';
      de.textContent = item.de;
      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = item.en;
      mid.appendChild(de);
      mid.appendChild(en);
      row.appendChild(mid);
      row.appendChild(playBtn(item.de));
      row.addEventListener('click', function () { speak(item.de); });
      el.appendChild(row);
    });
  }

  function stripArticle(s) {
    return s.replace(/^(der|die|das)\s+/i, '').split(' / ')[0].trim();
  }

  function renderBerufe(filter) {
    const list = document.getElementById('berufe-list');
    list.innerHTML = '';
    const q = (filter || '').toLowerCase();
    BERUFE.forEach(function (b) {
      const hay = (b.en + ' ' + b.m + ' ' + b.f).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      const card = document.createElement('div');
      card.className = 'beruf-card';
      const title = document.createElement('div');
      title.className = 'en-title';
      title.textContent = b.en;
      const forms = document.createElement('div');
      forms.className = 'forms';
      forms.appendChild(colorArticle(b.m, 'der'));
      forms.appendChild(document.createTextNode(' · '));
      forms.appendChild(colorArticle(b.mpl, 'plural'));
      forms.appendChild(document.createTextNode(' · '));
      forms.appendChild(colorArticle(b.f, 'die'));
      forms.appendChild(document.createTextNode(' · '));
      forms.appendChild(colorArticle(b.fpl, 'plural'));
      card.appendChild(title);
      card.appendChild(forms);
      card.appendChild(playBtn(b.m.split(' / ')[0]));
      card.style.flexWrap = 'wrap';
      card.addEventListener('click', function () { speak(b.m.split(' / ')[0]); });
      list.appendChild(card);
    });
  }

  function renderVerbs() {
    const el = document.getElementById('verbs');
    VERBS.forEach(function (v) {
      const h = document.createElement('h2');
      h.textContent = v.inf + ' (' + v.en + ')';
      el.appendChild(h);
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Pronoun</th><th>Form</th><th>English</th><th></th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      v.rows.forEach(function (r) {
        const tr = document.createElement('tr');
        tr.className = 'verb-row';
        const full = r.p + ' ' + r.f;
        tr.innerHTML = '<td>' + r.p + '</td><td' + (r.hi ? ' style="font-weight:800;color:#2563eb"' : '') + '>' + r.f + '</td><td style="color:#555">' + r.en + '</td><td></td>';
        const td = tr.querySelector('td:last-child');
        td.appendChild(playBtn(full));
        tr.addEventListener('click', function () { speak(full); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      el.appendChild(table);
    });
  }

  let quizMode = 'article';
  let score = 0;
  let total = 0;
  let answered = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function updateScore() {
    document.getElementById('quiz-score').textContent = 'Score: ' + score + ' / ' + total;
  }

  function newQuiz() {
    answered = false;
    document.getElementById('quiz-next').style.display = 'none';
    const prompt = document.getElementById('quiz-prompt');
    const opts = document.getElementById('quiz-options');
    opts.innerHTML = '';

    if (quizMode === 'article') {
      const b = pickRandom(BERUFE);
      const fem = Math.random() < 0.5;
      const full = fem ? b.f.split(' / ')[0] : b.m.split(' / ')[0];
      const noun = stripArticle(full);
      const correct = fem ? 'die' : 'der';
      prompt.innerHTML = 'Article for: <strong>' + noun + '</strong><br><span style="font-size:0.9rem;color:#666">' + b.en + ' (' + (fem ? 'feminine' : 'masculine') + ')</span>';
      ['der', 'die', 'das'].forEach(function (art) {
        const btn = document.createElement('button');
        btn.textContent = art;
        btn.addEventListener('click', function () { quizAnswer(btn, art === correct, correct, full); });
        opts.appendChild(btn);
      });
    } else if (quizMode === 'en-de') {
      const b = pickRandom(BERUFE);
      const fem = Math.random() < 0.5;
      const correct = fem ? b.f.split(' / ')[0] : b.m.split(' / ')[0];
      prompt.textContent = b.en;
      const wrong = shuffle(BERUFE.filter(function (x) { return x !== b; }).slice(0, 3)).map(function (x) {
        return (fem ? x.f : x.m).split(' / ')[0];
      });
      shuffle([correct].concat(wrong)).forEach(function (opt) {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.addEventListener('click', function () { quizAnswer(btn, opt === correct, correct, correct); });
        opts.appendChild(btn);
      });
    } else {
      const b = pickRandom(BERUFE);
      const fem = Math.random() < 0.5;
      const deForm = fem ? b.f.split(' / ')[0] : b.m.split(' / ')[0];
      const correct = b.en;
      prompt.innerHTML = '<span class="der" style="font-size:1.4rem">' + deForm + '</span>';
      const wrong = shuffle(BERUFE.filter(function (x) { return x !== b; }).slice(0, 3)).map(function (x) { return x.en; });
      shuffle([correct].concat(wrong)).forEach(function (opt) {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.addEventListener('click', function () { quizAnswer(btn, opt === correct, correct, deForm); });
        opts.appendChild(btn);
      });
    }
    speak(prompt.textContent.replace(/Article for:\s*/i, '').split('\n')[0]);
  }

  function quizAnswer(btn, ok, correct, speakText) {
    if (answered) return;
    answered = true;
    total++;
    if (ok) { score++; btn.classList.add('correct'); }
    else {
      btn.classList.add('wrong');
      Array.from(document.getElementById('quiz-options').children).forEach(function (b) {
        if (b.textContent === correct || b.textContent.indexOf(correct) === 0) b.classList.add('correct');
      });
    }
    updateScore();
    speak(speakText);
    document.getElementById('quiz-next').style.display = 'block';
  }

  document.querySelectorAll('nav.tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('berufe-search').addEventListener('input', function (e) {
    renderBerufe(e.target.value);
  });

  document.querySelectorAll('.quiz-mode button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.quiz-mode button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      quizMode = btn.dataset.mode;
      newQuiz();
    });
  });

  document.getElementById('quiz-next').addEventListener('click', newQuiz);

  renderPhrases();
  renderBerufe();
  renderVerbs();
  newQuiz();
})();
  </script>
</body>
</html>
